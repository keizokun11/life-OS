<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f6f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Life OS" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Life OS v0.4</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PERSONAL DAY PLANNER</p>
        <h1>Life OS</h1>
      </div>
      <button id="googleConnect" class="google-btn">Google Calendar<br><span>未接続</span></button>
    </header>

    <div id="notice" class="notice hidden"></div>

    <nav class="tabs">
      <button data-tab="today" class="active">今日</button>
      <button data-tab="tasks">課題</button>
      <button data-tab="history">記録</button>
      <button data-tab="settings">設定</button>
    </nav>

    <main>
      <section id="todayTab" class="tab-panel"></section>
      <section id="tasksTab" class="tab-panel hidden"></section>
      <section id="historyTab" class="tab-panel hidden"></section>
      <section id="settingsTab" class="tab-panel hidden"></section>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
</body>
</html>
