<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f6f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Life OS" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <title>Life OS v1.5.8</title>
  <link rel="stylesheet" href="./styles.css?v=1.5.8" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div><p class="eyebrow">PERSONAL DAY PLANNER</p><h1>Life OS</h1></div>
      <button id="googleConnect" class="google-btn">Google<br><span>未接続</span></button>
    </header>
    <div id="notice" class="notice hidden"></div>
    <nav class="tabs">
      <button data-tab="now" class="active">今やる</button>
      <button data-tab="today">今日</button>
      <button data-tab="timetable">時間割</button>
      <button data-tab="tasks">課題</button>
      <button data-tab="ideas">いつか</button>
      <button data-tab="history">記録</button>
      <button data-tab="settings">設定</button>
    </nav>
    <main>
      <section id="nowTab" class="tab-panel"></section>
      <section id="todayTab" class="tab-panel hidden"></section>
      <section id="timetableTab" class="tab-panel hidden"></section>
      <section id="tasksTab" class="tab-panel hidden"></section>
      <section id="ideasTab" class="tab-panel hidden"></section>
      <section id="historyTab" class="tab-panel hidden"></section>
      <section id="settingsTab" class="tab-panel hidden"></section>
    </main>
    <footer class="app-footer">Life OS v1.5.8 ・ 課題ごとの期限死守モード</footer>
  </div>
  <script type="module" src="./app.js?v=1.5.8"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=1.5.8').catch(()=>{});</script>
</body>
</html>
